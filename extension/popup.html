<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <span class="logo">✈</span>
      <span class="brand-name">ApplyPilot</span>
    </div>
    <span id="conn" class="conn conn--off">Not connected</span>
  </header>

  <!-- Token setup (shown until a working token is saved) -->
  <section id="setup" class="setup" hidden>
    <p class="setup-hint">Paste the token printed by the dashboard on startup
      (found in <code>~/.applypilot/ext_token</code>).</p>
    <div class="row">
      <input id="token" type="password" class="input" placeholder="ApplyPilot token" spellcheck="false" autocomplete="off" />
      <button id="token-save" class="btn btn--primary">Save</button>
    </div>
    <p id="setup-err" class="err" hidden></p>
  </section>

  <!-- Main -->
  <section id="main" hidden>
    <div class="toolbar">
      <button id="refresh" class="btn btn--primary">↻ Refresh contacts</button>
      <button id="settings-toggle" class="btn btn--ghost" title="Change token">⚙</button>
    </div>

    <!--
      Reading the open thread. Shown ONLY when the active tab is a LinkedIn conversation —
      a button that is present everywhere and works in one place reads as broken everywhere
      else (§Lessons 43: four controls shipped in one day that nobody could find or that did
      nothing visible). Nothing is read until this is clicked: `activeTab` is granted per
      click, for that tab only.
    -->
    <section id="thread" class="thread" hidden>
      <button id="thread-read" class="btn btn--primary btn--wide">📥 Read this thread</button>
      <div id="thread-status" class="thread-status" hidden></div>
      <div id="thread-who" class="thread-who" hidden>
        <label for="thread-contact">Log against</label>
        <select id="thread-contact" class="input"></select>
      </div>
      <div id="thread-msgs" class="thread-msgs"></div>
      <button id="thread-save" class="btn btn--primary btn--wide" hidden>Log messages</button>
    </section>

    <div id="count" class="count"></div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>
      No contacts yet. Run <strong>Find contacts</strong> in the dashboard, then Refresh.
    </div>
  </section>

  <footer class="foot">Copy the note, open their LinkedIn, paste &amp; send. You stay in control.</footer>

  <script src="thread_parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
